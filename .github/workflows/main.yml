name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@18e9594780aeace92770d9bab1daf7ab1c8274d1 # v0.30.1

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
