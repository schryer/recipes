# The site's buttons (add or merge an ingredient, add a substitution note)
# open an issue holding a ```recipe-host request; this turns it into a pull
# request for review. See https://github.com/schryer/recipe-host.
name: Requests

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: request-${{ github.event.issue.number }}

jobs:
  request:
    if: contains(github.event.issue.body, '```recipe-host')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: schryer/recipe-host@v0.1.0
        with:
          command: request
